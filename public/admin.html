<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — GREEND TOP UP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="grid-overlay" aria-hidden="true"></div>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a href="/" class="brand">
      <img src="/assets/diamond.png" alt="" class="brand-mark">
      <span class="brand-name">GREEND<span class="brand-dot"> TOP UP</span></span>
    </a>
    <nav class="topbar-links">
      <span>Admin</span>
    </nav>
  </div>
</header>

<div class="admin-shell wrap">
  <div class="admin-toolbar">
    <input type="text" id="search-input" placeholder="Cari Order ID...">
    <select id="status-filter">
      <option value="">Semua Status Bayar</option>
      <option value="paid">Paid</option>
      <option value="pending">Pending</option>
      <option value="failed">Failed</option>
    </select>
    <select id="delivery-filter">
      <option value="">Semua Status Pengiriman</option>
      <option value="belum_diproses">Belum Diproses</option>
      <option value="diproses">Diproses</option>
      <option value="terkirim">Terkirim</option>
      <option value="gagal">Gagal</option>
    </select>
    <button type="button" id="refresh-btn">Refresh</button>
    <span class="admin-count" id="admin-count"></span>
  </div>

  <div class="admin-table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Produk</th>
          <th>Akun</th>
          <th>Harga</th>
          <th>Bayar</th>
          <th>Pengiriman</th>
          <th>Kontak</th>
          <th>Dibuat</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="orders-body">
        <tr><td colspan="9" class="admin-empty">Memuat...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
