<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lacak Status Pesanan — JAGESTORE</title>
<meta name="description" content="Cek status transaksi dan pengiriman diamond Mobile Legends secara real-time di JAGESTORE.">
<meta name="theme-color" content="#060814">
<link rel="icon" type="image/png" href="/assets/diamond.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="grid-overlay" aria-hidden="true"></div>

<!-- TOPBAR -->
<header class="topbar">
  <div class="wrap topbar-inner">
    <a href="/" class="brand">
      <img src="/assets/diamond.png" alt="JAGESTORE" class="brand-mark">
      <span class="brand-name">JAGE<span class="brand-dot">STORE</span></span>
    </a>
    
    <div class="topbar-right">
      <nav class="topbar-links">
        <a href="/">← Beli Diamond</a>
        <a href="https://wa.me/6281295713923?text=Halo%20Admin%20JAGESTORE%2C%20saya%20butuh%20bantuan" target="_blank" rel="noopener" class="btn-nav-cs">
          💬 Bantuan CS
        </a>
      </nav>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="status-shell">
    
    <!-- HEADER -->
    <div class="status-header-box">
      <h1 class="status-page-title">Lacak Pesanan Kamu</h1>
      <p class="status-page-desc">Pantau status pembayaran dan pengiriman diamond secara real-time</p>
    </div>

    <!-- SEARCH BAR -->
    <div class="status-search-box">
      <form class="status-form" id="lookup-form">
        <input type="text" id="order_id_input" placeholder="Masukkan Order ID (contoh: MLTOP-17...)" required>
        <button type="submit">Cari 🔍</button>
      </form>
    </div>

    <!-- STATUS CARD RESULT -->
    <div class="status-card" id="status-card">
      <p style="color:var(--text-muted); text-align:center; padding: 20px 0;">
        Masukkan Order ID di atas untuk melihat rincian pesanan dan status pengiriman.
      </p>
    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>© 2026 JAGESTORE. Semua hak cipta dilindungi. · <a href="/">Beranda</a> · <a href="/terms.html">Syarat &amp; Ketentuan</a></p>
  </div>
</footer>

<script>
  const card = document.getElementById('status-card');
  const form = document.getElementById('lookup-form');
  const input = document.getElementById('order_id_input');

  const statusLabel = { 
    paid: 'Lunas — Diamond Terkirim', 
    pending: 'Menunggu Pembayaran', 
    failed: 'Gagal / Dibatalkan' 
  };
  const statusClass = { paid: 'paid', pending: 'pending', failed: 'failed' };
  const ADMIN_WHATSAPP = '6281295713923';

  function waLink(orderId, text) {
    return `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(text)}`;
  }

  function formatRupiah(n) { 
    return 'Rp' + Number(n).toLocaleString('id-ID'); 
  }

  let pollTimer = null;

  async function lookup(orderId, isPoll) {
    if (!isPoll) {
      card.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:30px 0;">Memuat data transaksi…</p>';
    }
    
    try {
      const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}`);
      const data = await res.json();

      if (!res.ok) {
        clearInterval(pollTimer);
        card.innerHTML = `
          <div style="text-align:center; padding: 20px 0;">
            <div style="font-size:2.2rem; margin-bottom:8px;">❌</div>
            <h2 class="status-product-title" style="font-size:1.3rem;">Order Tidak Ditemukan</h2>
            <p class="status-page-desc" style="margin-top:6px;">Order ID "${orderId}" tidak terdaftar di sistem kami. Pastikan nomor ID sudah benar.</p>
          </div>
        `;
        return;
      }

      const label = statusLabel[data.status] || data.status;
      const cls = statusClass[data.status] || 'pending';
      const shareUrl = `${window.location.origin}/status.html?order_id=${encodeURIComponent(data.order_id)}`;
      const isPaid = data.status === 'paid';
      const isPending = data.status === 'pending';
      const isDelivered = data.delivery_status === 'terkirim';
      const isProcessing = isPaid && !isDelivered && data.delivery_status !== 'gagal';

      card.innerHTML = `
        <div class="status-top-meta">
          <span class="status-pill ${cls}">● ${label}</span>
          <span style="font-size:0.75rem; color:var(--text-muted);">
            ${new Date(data.created_at).toLocaleString('id-ID')}
          </span>
        </div>

        <h2 class="status-product-title">${data.product_name}</h2>
        
        <div class="status-order-id-badge" id="order-badge" style="cursor:pointer;" title="Klik untuk salin">
          <span>Order ID: <strong>${data.order_id}</strong></span>
          <span style="font-size:0.75rem;">📋 Salin</span>
        </div>

        <!-- PROGRESS STEPPER -->
        <div class="status-stepper">
          <div class="stepper-step is-done">
            <span class="stepper-dot">✓</span>
            <span>1. Pesanan Dibuat</span>
          </div>
          <div class="stepper-step ${isPaid ? 'is-done' : (isPending ? 'is-active' : '')}">
            <span class="stepper-dot">${isPaid ? '✓' : '2'}</span>
            <span>2. Verifikasi Bayar</span>
          </div>
          <div class="stepper-step ${isDelivered ? 'is-done' : (isProcessing ? 'is-active' : '')}">
            <span class="stepper-dot">${isDelivered ? '✓' : '3'}</span>
            <span>3. Pengiriman Diamond</span>
          </div>
        </div>

        <!-- SN / SERIAL NUMBER BOX (IF SUCCESS) -->
        ${data.delivery_sn ? `
          <div style="background:rgba(0,230,153,0.08); border:1px solid rgba(0,230,153,0.35); border-radius:12px; padding:14px 16px; margin: 16px 0; display:flex; flex-direction:column; gap:4px; box-shadow:0 0 16px var(--success-glow);">
            <div style="font-size:0.75rem; font-weight:700; color:var(--success); text-transform:uppercase; letter-spacing:0.04em;">
              ✓ Bukti Pengiriman Resmi Moonton (SN)
            </div>
            <div style="font-family:var(--font-mono); font-size:0.95rem; color:#fff; word-break:break-all; font-weight:600;">
              ${data.delivery_sn}
            </div>
          </div>
        ` : ''}

        <!-- QRIS MANUAL SECTION (IF PENDING) -->
        ${isPending && data.payment_type === 'qris-manual' ? `
          <div class="qris-manual-box">
            <div style="font-size:0.85rem; font-weight:700; color:var(--cyan); text-transform:uppercase; letter-spacing:0.04em;">
              ⚡ Scan QRIS untuk Menyelesaikan Pembayaran
            </div>
            
            <img src="/assets/qris.png" alt="QRIS JAGESTORE" class="qris-manual-img">
            
            <div class="qris-actions">
              <a class="status-download-btn" href="/assets/qris.png" download="QRIS-${data.order_id}.png">
                ⬇ Unduh Gambar QRIS
              </a>
              <button type="button" class="status-copy-nominal-btn" id="copy-nominal-btn">
                💵 Salin Nominal: ${formatRupiah(data.price)}
              </button>
            </div>

            <p style="font-size:0.8rem; color:var(--text-secondary); line-height:1.5; margin: 10px 0;">
              Buka aplikasi DANA, GoPay, OVO, ShopeePay, atau m-Banking Anda, lalu scan QRIS di atas dan bayar tepat <strong>${formatRupiah(data.price)}</strong>.
            </p>

            <a class="status-wa-btn" target="_blank" rel="noopener" href="${waLink(data.order_id, `Halo admin, saya sudah bayar untuk Order ${data.order_id} (${data.product_name}) sebesar ${formatRupiah(data.price)}. Mohon segera dikonfirmasi. Terima kasih.`)}">
              💬 Konfirmasi Sudah Bayar via WhatsApp
            </a>

            <p style="font-size:0.75rem; color:var(--text-muted); margin-top:12px;">
              🔄 Layar ini otomatis mendeteksi dan berubah hijau begitu pembayaran dikonfirmasi admin...
            </p>
          </div>
        ` : ''}

        <!-- INVOICE DETAIL ROWS -->
        <div class="status-details">
          <div class="status-row">
            <span>ID Akun &amp; Server</span>
            <span>${data.game_user_id} (${data.game_zone_id || '-'})</span>
          </div>
          <div class="status-row">
            <span>Metode Pembayaran</span>
            <span>${data.payment_type ? data.payment_type.toUpperCase() : 'QRIS'}</span>
          </div>
          <div class="status-row highlight-price">
            <span>Total Pembayaran</span>
            <span>${formatRupiah(data.price)}</span>
          </div>
        </div>

        <!-- ACTIONS -->
        <div class="status-action-links">
          <button type="button" class="status-copy-btn" id="copy-link-btn">
            🔗 Salin Link Lacak Pesanan Ini
          </button>
          <div style="display:flex; justify-content:space-between; gap:10px; margin-top:4px;">
            <a href="/" class="status-wa-link" style="color:var(--cyan); font-weight:600;">+ Pesan Diamond Lagi</a>
            <a class="status-wa-link" target="_blank" rel="noopener" href="${waLink(data.order_id, `Halo admin, saya butuh bantuan untuk Order ${data.order_id}.`)}">
              Butuh Bantuan? Chat CS
            </a>
          </div>
        </div>
      `;

      // Copy Nominal Handler
      const copyNominalBtn = document.getElementById('copy-nominal-btn');
      if (copyNominalBtn) {
        copyNominalBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(String(data.price));
            copyNominalBtn.textContent = '✓ Nominal Tersalin!';
            setTimeout(() => (copyNominalBtn.textContent = `💵 Salin Nominal: ${formatRupiah(data.price)}`), 1500);
          } catch {
            copyNominalBtn.textContent = String(data.price);
          }
        });
      }

      // Copy Order ID Handler
      const orderBadge = document.getElementById('order-badge');
      if (orderBadge) {
        orderBadge.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(data.order_id);
            orderBadge.innerHTML = `<span>✓ Order ID <strong>${data.order_id}</strong> Tersalin!</span>`;
            setTimeout(() => {
              orderBadge.innerHTML = `<span>Order ID: <strong>${data.order_id}</strong></span><span style="font-size:0.75rem;">📋 Salin</span>`;
            }, 1500);
          } catch {}
        });
      }

      // Copy Link Handler
      const copyBtn = document.getElementById('copy-link-btn');
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(shareUrl);
            copyBtn.textContent = '✓ Link Halaman Tersalin!';
            setTimeout(() => (copyBtn.textContent = '🔗 Salin Link Lacak Pesanan Ini'), 1500);
          } catch {
            copyBtn.textContent = shareUrl;
          }
        });
      }

      // Polling real-time jika masih pending
      if (isPending) {
        if (!pollTimer) {
          pollTimer = setInterval(() => lookup(orderId, true), 4000);
        }
      } else {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    } catch (err) {
      if (!isPoll) card.innerHTML = '<p style="color:var(--magenta); text-align:center; padding:20px 0;">Gagal memuat status pesanan. Silakan periksa koneksi internet.</p>';
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    clearInterval(pollTimer);
    pollTimer = null;
    const val = input.value.trim();
    if (val) lookup(val);
  });

  // Auto-lookup dari URL param
  const params = new URLSearchParams(window.location.search);
  const orderIdParam = params.get('order_id');
  if (orderIdParam) {
    input.value = orderIdParam;
    lookup(orderIdParam);
  }
</script>

</body>
</html>
